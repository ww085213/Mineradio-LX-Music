name: Build standalone iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare standalone Capacitor project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ios-build/www
          rsync -a --delete public/ ios-build/www/
          mkdir -p ios-build/www/nodejs
          cp ios-support/mobile-bridge.js ios-build/www/mobile-bridge.js

          # Bundle the desktop Node backend and its static assets inside the app.
          find . -maxdepth 1 -type f -name '*.js' -exec cp {} ios-build/www/nodejs/ \;
          rsync -a public/ ios-build/www/nodejs/public/
          for dir in cuefield qishui-audio-decryptor qishui-auth-v6; do
            if [[ -d "$dir" ]]; then rsync -a "$dir/" "ios-build/www/nodejs/$dir/"; fi
          done
          cp ios-support/mobile-node-main.js ios-build/www/nodejs/mobile-node-main.js

          python3 - <<'PY'
          from pathlib import Path

          index = Path('ios-build/www/index.html')
          html = index.read_text(encoding='utf-8')
          tag = '<script src="mobile-bridge.js"></script>'
          if tag not in html:
              if '</head>' not in html:
                  raise SystemExit('index.html does not contain </head>')
              html = html.replace('</head>', tag + '\n</head>', 1)
          index.write_text(html, encoding='utf-8')
          PY

          cat > ios-build/www/nodejs/package.json <<'JSON'
          {
            "name": "mineradio-ios-node",
            "productName": "Mineradio",
            "version": "1.6.1",
            "private": true,
            "main": "mobile-node-main.js",
            "mineradio": {
              "releaseVersion": "1.6.1",
              "update": {
                "provider": "github",
                "owner": "ww085213",
                "repo": "Mineradio-LX-Music",
                "preview": true
              }
            },
            "dependencies": {
              "qrcode": "1.5.4"
            }
          }
          JSON
          npm install --prefix ios-build/www/nodejs --omit=dev --no-audit --no-fund

          cd ios-build
          cat > package.json <<'JSON'
          {
            "name": "mineradio-ios-build",
            "version": "1.6.1",
            "private": true,
            "dependencies": {
              "@capacitor/cli": "8.4.0",
              "@capacitor/core": "8.4.0",
              "@capacitor/ios": "8.4.0",
              "@capawesome/capacitor-nodejs": "0.1.0"
            }
          }
          JSON
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.ww085213.mineradio.mobile",
            "appName": "Mineradio",
            "webDir": "www",
            "ios": {
              "contentInset": "automatic",
              "preferredContentMode": "mobile"
            },
            "plugins": {
              "Nodejs": {
                "nodeDir": "nodejs",
                "startMode": "auto"
              }
            },
            "server": {
              "iosScheme": "capacitor",
              "allowNavigation": ["127.0.0.1", "localhost"]
            }
          }
          JSON
          npm install --no-audit --no-fund
          npx cap add ios --packagemanager SPM
          npx cap sync ios

      - name: Configure iOS metadata
        shell: bash
        run: |
          set -euo pipefail
          PLIST="ios-build/ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string Mineradio runs its music engine locally on this iPhone." "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Mineradio" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.6.1" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 2" "$PLIST"

      - name: Build unsigned standalone device app
        shell: bash
        run: |
          set -euo pipefail
          cd ios-build/ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/mineradio-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

          APP_PATH=$(find "$RUNNER_TEMP/mineradio-derived/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/Mineradio.app"
          cd "$RUNNER_TEMP/ipa"
          zip -qry Mineradio-1.6.1-standalone-crashfix-unsigned.ipa Payload
          shasum -a 256 Mineradio-1.6.1-standalone-crashfix-unsigned.ipa > Mineradio-1.6.1-standalone-crashfix-unsigned.SHA256.txt

      - name: Upload standalone unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mineradio-iOS-standalone-crashfix-unsigned
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/ipa/Mineradio-1.6.1-standalone-crashfix-unsigned.ipa
            ${{ runner.temp }}/ipa/Mineradio-1.6.1-standalone-crashfix-unsigned.SHA256.txt
