name: Build iOS unsigned IPA

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: Optional HTTPS backend URL compiled into the app
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare Capacitor project
        shell: bash
        env:
          MINERADIO_BACKEND_URL: ${{ inputs.backend_url }}
        run: |
          set -euo pipefail
          mkdir -p ios-build/www
          rsync -a --delete public/ ios-build/www/
          cp ios-support/mobile-bridge.js ios-build/www/mobile-bridge.js

          python3 - <<'PY'
          from pathlib import Path
          import os

          root = Path('ios-build/www')
          bridge = root / 'mobile-bridge.js'
          backend = os.environ.get('MINERADIO_BACKEND_URL', '').strip().rstrip('/')
          text = bridge.read_text(encoding='utf-8').replace('__MINERADIO_BACKEND_URL__', backend)
          bridge.write_text(text, encoding='utf-8')

          index = root / 'index.html'
          html = index.read_text(encoding='utf-8')
          tag = '<script src="mobile-bridge.js"></script>'
          if tag not in html:
              if '</head>' not in html:
                  raise SystemExit('index.html does not contain </head>')
              html = html.replace('</head>', tag + '\n</head>', 1)
          index.write_text(html, encoding='utf-8')
          PY

          cd ios-build
          cat > package.json <<'JSON'
          {
            "name": "mineradio-ios-build",
            "version": "1.6.0",
            "private": true,
            "dependencies": {
              "@capacitor/cli": "7.4.3",
              "@capacitor/core": "7.4.3",
              "@capacitor/ios": "7.4.3"
            }
          }
          JSON
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.ww085213.mineradio.mobile",
            "appName": "Mineradio",
            "webDir": "www",
            "ios": {
              "contentInset": "automatic",
              "preferredContentMode": "mobile"
            },
            "server": {
              "iosScheme": "https",
              "allowNavigation": ["*"]
            }
          }
          JSON
          npm install --no-audit --no-fund
          npx cap add ios
          npx cap sync ios

      - name: Configure iOS metadata
        shell: bash
        run: |
          set -euo pipefail
          PLIST="ios-build/ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string Mineradio may connect to a user-selected music service." "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Mineradio" "$PLIST"

      - name: Build unsigned device app
        shell: bash
        run: |
          set -euo pipefail
          cd ios-build/ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/mineradio-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

          APP_PATH=$(find "$RUNNER_TEMP/mineradio-derived/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/Mineradio.app"
          cd "$RUNNER_TEMP/ipa"
          zip -qry Mineradio-1.6.0-unsigned.ipa Payload
          shasum -a 256 Mineradio-1.6.0-unsigned.ipa > Mineradio-1.6.0-unsigned.SHA256.txt

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mineradio-iOS-unsigned
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/ipa/Mineradio-1.6.0-unsigned.ipa
            ${{ runner.temp }}/ipa/Mineradio-1.6.0-unsigned.SHA256.txt
